log_format redacted escape=json '{"requestId":"$sent_http_x_request_id","method":"$request_method","status":$status,"durationSeconds":$request_time}';
upstream identity_service {
  zone identity_service 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server identity:5000 resolve;
  keepalive 16;
}
upstream booking_service {
  zone booking_service 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server booking:5000 resolve;
  keepalive 16;
}
upstream payments_service {
  zone payments_service 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server payments:5000 resolve;
  keepalive 16;
}
upstream catalog_service {
  zone catalog_service 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server catalog:5000 resolve;
  keepalive 16;
}
server {
  listen 80;
  client_max_body_size 5m;
  server_name _;
  root /usr/share/nginx/html;
  access_log /dev/stdout redacted;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  include /etc/nginx/proxy-headers.conf;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;
  proxy_next_upstream error timeout;
  location /internal/ { return 404; }
  location /api/v1/auth/ {
    proxy_pass http://identity_service;
    error_log /dev/stderr crit;
  }
  location /api/v1/me { proxy_pass http://identity_service; }
  location = /api/v1/events { proxy_pass http://catalog_service; }
  location /api/v1/payments/ { proxy_pass http://payments_service; }
  location /api/v1/webhooks/ { proxy_pass http://payments_service; }
  location /api/ { proxy_pass http://booking_service; }
  location / { try_files $uri $uri/ /index.html; }
}
